# Lives in doufujun/UniXNU-clover fork only — do NOT PR to upstream without asking.
# prepare-owner-data-fixture.py is in UniXNU/UniXNU; this workflow checks that out.
# CI seed UUID/sha256 will almost never match pinned ef00c083… / FC1A580E-…

name: clover-owner-data-seed

on:
  workflow_dispatch:
    inputs:
      unixnu_ref:
        description: UniXNU/UniXNU git ref
        required: true
        default: main
      ipsw_url:
        description: iPadOS 17.7.11 21H461 IPSW URL
        required: true
        default: "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"

permissions:
  contents: read


jobs:
  seed:
    runs-on: macos-15-intel
    timeout-minutes: 180
    steps:
      - name: Check out UniXNU/UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: ${{ inputs.unixnu_ref }}
          path: UniXNU
          persist-credentials: false

      - name: Download IPSW
        working-directory: UniXNU
        env:
          IPSW_URL: ${{ inputs.ipsw_url }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipsw"
          curl -L --fail --retry 5 -o "$RUNNER_TEMP/ipsw/restore.ipsw" "$IPSW_URL"
          ls -lh "$RUNNER_TEMP/ipsw/restore.ipsw"

      - name: Extract and mount OS (os-mount)
        working-directory: UniXNU
        run: |
          set -euo pipefail
          OS_DMG=044-76040-038.dmg
          WANT_LAUNCHD=8cec9a3c44a443b08e977ccc5d577850316ad428c575dc01f09b018dbd5b6a25
          mkdir -p "$RUNNER_TEMP/ipsw-extract"
          unzip -o "$RUNNER_TEMP/ipsw/restore.ipsw" "$OS_DMG" -d "$RUNNER_TEMP/ipsw-extract"
          ATTACH_PLIST=$(mktemp)
          hdiutil attach -nobrowse -readonly -noverify -plist \
            "$RUNNER_TEMP/ipsw-extract/$OS_DMG" > "$ATTACH_PLIST"
          export ATTACH_PLIST WANT_LAUNCHD
          python3 <<'PY'
          import hashlib, os, pathlib, plistlib, sys
          want = os.environ["WANT_LAUNCHD"]
          root = pathlib.Path(".").resolve()
          os_mount = root / ".cache/firmware/target-volumes/os-mount"
          os_mount.parent.mkdir(parents=True, exist_ok=True)
          if os_mount.exists() or os_mount.is_symlink():
              sys.exit(f"refuse existing {os_mount}")
          pl = plistlib.loads(pathlib.Path(os.environ["ATTACH_PLIST"]).read_bytes())
          found = None
          for ent in pl.get("system-entities", []):
              mp = ent.get("mount-point")
              if not mp:
                  continue
              launchd = pathlib.Path(mp) / "sbin" / "launchd"
              if not launchd.is_file():
                  continue
              got = hashlib.sha256(launchd.read_bytes()).hexdigest()
              print(f"candidate {mp} launchd_sha256={got}")
              if got == want:
                  found = mp
                  break
          if not found:
              sys.exit("no mounted volume with expected sbin/launchd sha256")
          os.symlink(found, os_mount)
          print(f"symlinked os-mount -> {found}")
          PY

      - name: Run prepare-owner-data-fixture.py
        working-directory: UniXNU
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/owner-data-out"
          python3 scripts/prepare-owner-data-fixture.py --output "$OUT"
          ls -lh "$OUT"
          python3 <<'PY'
          import hashlib, json, os, pathlib
          out = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "owner-data-out"
          cdr = out / "owner-data-32.cdr"
          data = cdr.read_bytes()
          seed_json = None
          if (out / "seed.json").is_file():
              seed_json = json.loads((out / "seed.json").read_text())
          rep = {
              "bytes": len(data),
              "sha256": hashlib.sha256(data).hexdigest(),
              "nxsb_ok": data[32:36] == b"NXSB",
              "seed_json": seed_json,
              "pinned_clover_sha256": "ef00c083fc54453c4ff6062c2e6947ddbba63e96aabcfd27d2273a53e4d3918c",
              "pinned_clover_uuid": "FC1A580E-2D67-48FC-B8CF-87422A319340",
              "note": "CI seed is NEW. Retarget UniXNU-clover host pins (and kernel UUID if different) before append-data-window.",
          }
          (out / "ci-report.json").write_text(json.dumps(rep, indent=2) + "\n")
          print(json.dumps(rep, indent=2))
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clover-owner-data-seed
          path: |
            owner-data-out/owner-data-32.cdr
            owner-data-out/seed.json
            owner-data-out/ci-report.json
          if-no-files-found: error
          retention-days: 14
